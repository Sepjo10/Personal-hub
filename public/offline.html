<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14121c" />
    <title>Sin conexión · Personal Hub</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #14121c; color: #eeedf3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { padding: 2rem; max-width: 22rem; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #a8a4b8; font-size: 0.9rem; line-height: 1.5; }
      button {
        margin-top: 1rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 0.6rem;
        background: #8b5cf6; color: #fff; font-size: 0.9rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Personal Hub necesita internet para mostrar tus datos. Por seguridad no se guardan copias en el dispositivo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
